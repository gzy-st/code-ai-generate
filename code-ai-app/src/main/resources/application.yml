spring:
  application:
    name: code-ai-app
  profiles:
    active: local
  # session 共享（同 Redis）
  web:
    resources:
      add-mappings: false
  session:
    store-type: redis
    timeout: 2592000
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/code_generate?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: root
  # redis
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password:
server:
  port: 8125
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: 2592000
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.guozy.codeaigenerate.controller

# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

# LangChain4j
langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.deepseek.com
      api-key: ${AI_API_KEY:your-api-key}
      model-name: deepseek-chat
      log-requests: true
      log-responses: true
      max-tokens: 8192
    streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key: ${AI_API_KEY:your-api-key}
      model-name: deepseek-chat
      max-tokens: 8192
      log-requests: true
      log-responses: true

# 监控端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

# Dubbo
dubbo:
  registry:
    address: nacos://127.0.0.1:8848?username=nacos&password=nacos
    register-mode: instance
  protocol:
    name: tri
    port: 50053
  consumer:
    timeout: 120000
  provider:
    timeout: 120000