spring:
  application:
    name: code-ai-generate-backend
  profiles:
      active: local
  # redis
  data:
    redis:
      host: localhost
      port: 6379
      password:
      ttl: 3600
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/code_generate
    username: root
    password: root
server:
  port: 8123
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.guozy.codeaigenerate.controller

# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn


